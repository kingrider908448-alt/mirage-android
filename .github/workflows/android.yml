name: Build Android APKs
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify core and build both apps
        run: |
          python scripts/import_device_catalog.py --pinned
          git diff --exit-code -- catalog/source-records.json catalog/DEVICES.md core/src/main/resources/dev/ghostviki/core/device-profiles.tsv
          java scripts/RunConfigChecks.java
          gradle --no-daemon :core:check :app:lintDebug :probe:lintDebug :app:assembleDebug :probe:assembleDebug
      - name: Verify catalog packaged in module APK
        run: python scripts/check_apk_catalog.py app/build/outputs/apk/debug/app-debug.apk
      - name: Collect APKs and checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GhostViki-alpha.apk
          cp probe/build/outputs/apk/debug/probe-debug.apk artifacts/GhostViki-Probe.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GhostViki-debug-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            probe/build/reports/
          if-no-files-found: ignore
